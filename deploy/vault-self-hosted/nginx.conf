worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  sendfile on;

  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Directory URLs without a trailing slash (/plus, /security) get a 301 to
    # the slash form. nginx would build that Location from its own listen port
    # and scheme (http://host:8080/...), which is wrong behind the TLS proxy;
    # keep it relative so the browser stays on the public origin.
    absolute_redirect off;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # Vite emits everything under /assets/ as assets/[name]-[hash][extname]
    # (excalidraw-app/vite.config.mts), so these files are content-addressed and
    # safe to cache immutably.
    #
    # Keep this scoped to /assets/ only. /fonts/** and the files copied verbatim
    # from public/ are NOT content-hashed, and index.html must never be cached
    # long-term: a stale index.html would request hashed assets that no longer
    # exist in a newer image and blank the app. PWA is disabled in this
    # deployment, so the HTTP cache is the only cache layer.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA entry point. Also reached via the try_files fallback below, because
    # try_files' last argument is an internal redirect that re-matches locations.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # Brand pages are separate HTML entries next to the SPA (excalidraw-app/
    # vite.config.mts BRAND_PAGES). Like index.html they reference hashed
    # assets, so they must be revalidated on every load. /plus and /plus/ reach
    # these files through try_files' `$uri/` and the index directive, an
    # internal redirect that re-matches locations.
    location = /plus/index.html {
      add_header Cache-Control "no-cache";
    }

    location = /security/index.html {
      add_header Cache-Control "no-cache";
    }

    # Defense in depth: this deployment builds with sourcemaps disabled
    # (excalidraw-app/vite.config.mts), but block them anyway so a future
    # sourcemap change cannot publish ~26 MB of maps from the public origin.
    location ~* \.map$ {
      return 404;
    }

    # Everything else (/fonts/**, public/ files) keeps nginx's default
    # ETag/Last-Modified revalidation, including single-file-runtime-template.txt,
    # which changes on every build and must not be served stale.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
